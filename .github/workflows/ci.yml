name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Drupal ${{ matrix.drupal }} / TMGMT ${{ matrix.tmgmt }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            drupal: '10.x current'
            core: '^10.3'
            tmgmt: '1.17.0'
          - php: '8.1'
            drupal: '10.x current'
            core: '^10.3'
            tmgmt: '1.18.0'
          - php: '8.3'
            drupal: '11.x current'
            core: '^11'
            tmgmt: '1.18.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select compatibility lane
        run: |
          composer require --no-update "drupal/core:${{ matrix.core }}" "drupal/tmgmt:${{ matrix.tmgmt }}"
          composer require --dev --no-update "drupal/core-dev:${{ matrix.core }}"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Coding standards
        run: composer lint

      - name: Tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: composer test

  composer-install:
    name: Composer install / Drupal ${{ matrix.drupal }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            drupal: '10'
            core: '^10.3'
            drush: '^12.5'
          - php: '8.3'
            drupal: '11'
            core: '^11'
            drush: '^13.7'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install through a Drupal root project and enable the module
        run: bash bin/test-composer-install.sh "${{ matrix.core }}" "${{ matrix.drush }}"
