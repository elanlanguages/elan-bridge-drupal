name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Drupal ${{ matrix.drupal }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            drupal: '10'
            core: '^10.3'
          - php: '8.3'
            drupal: '11'
            core: '^11'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select Drupal core
        run: |
          composer require --no-update "drupal/core:${{ matrix.core }}"
          composer require --dev --no-update "drupal/core-dev:${{ matrix.core }}"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Coding standards
        run: composer lint

      - name: Unit tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: composer test
