name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Drupal ${{ matrix.drupal }} / TMGMT ${{ matrix.tmgmt }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            drupal: '10.x current'
            core: '^10.3'
            tmgmt: '1.17.0'
          - php: '8.1'
            drupal: '10.x current'
            core: '^10.3'
            tmgmt: '1.18.0'
          - php: '8.3'
            drupal: '11.x current'
            core: '^11'
            tmgmt: '1.18.0'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Select compatibility lane
        run: |
          composer require --no-update "drupal/core:${{ matrix.core }}" "drupal/tmgmt:${{ matrix.tmgmt }}"
          composer require --dev --no-update "drupal/core-dev:${{ matrix.core }}"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Coding standards
        run: composer lint

      - name: Tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: composer test
